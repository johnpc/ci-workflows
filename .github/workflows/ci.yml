name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"
      - name: actionlint (reusable workflows; runs shellcheck on their run blocks)
        run: actionlint -color
      - name: shellcheck (action scripts)
        run: shellcheck -x actions/*/*.sh
      - name: shellcheck (composite action run blocks)
        run: |
          pip install --quiet pyyaml
          python3 scripts/lint-composite-actions.py
      - name: Python helpers compile
        run: python3 -m py_compile actions/*/*.py scripts/*.py
