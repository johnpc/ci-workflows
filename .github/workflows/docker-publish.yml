name: Docker publish

# Reusable: build a multi-arch image and push it to Docker Hub with
# docker/metadata-action tags (branch, semver tag, sha, latest on the default branch).
#
#   jobs:
#     publish:
#       uses: johnpc/ci-workflows/.github/workflows/docker-publish.yml@v1
#       secrets: inherit
#       with:
#         image: johnpc/subsyncarr
on:
  workflow_call:
    inputs:
      image:
        description: Image name, e.g. johnpc/app (Docker Hub)
        type: string
        required: true
      context:
        type: string
        default: .
      file:
        type: string
        default: Dockerfile
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Push the image (false on pull requests is typical)
        type: boolean
        default: true
      runner:
        type: string
        default: '"ubuntu-latest"'
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  publish:
    name: Build and push ${{ inputs.image }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
